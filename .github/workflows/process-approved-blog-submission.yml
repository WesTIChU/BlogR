name: Process approved directory submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: directory-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process:
    if: >-
      github.event.label.name == 'approved' && github.event.issue.state ==
      'open' && ( (contains(github.event.issue.body, '### Blog name') &&
      contains(github.event.issue.body, '### Blog URL') &&
      (contains(github.event.issue.body, '### Main category') ||
      contains(github.event.issue.body, '### Category / Subcategory') ||
      (contains(github.event.issue.body, '### Category') &&
      contains(github.event.issue.body, '### Subcategory'))) ||
      (contains(github.event.issue.body, '### Community name') &&
      contains(github.event.issue.body, '### Website URL') &&
      contains(github.event.issue.body, '### Category') &&
      contains(github.event.issue.body, '### Community type')) ||
      (contains(github.event.issue.body, '### Website name') &&
      contains(github.event.issue.body, '### Website URL') &&
      contains(github.event.issue.body, '### Description') &&
      contains(github.event.issue.body, '### Category'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint repository GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BLOGR_APP_ID }}
          private-key: ${{ secrets.BLOGR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        uses: pnpm/action-setup@v4
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate approval and create pull request
        env:
          BLOGR_TOKEN: ${{ steps.app-token.outputs.token }}
          APPROVER_LOGIN: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Keep generated catalogue Markdown consistent with the production
          # Webring-enabled catalogue, including existing BlogWebring tags.
          VITE_WEBRING_PUBLIC_ENABLED: 'true'
        run: node scripts/process-blog-submission.js
