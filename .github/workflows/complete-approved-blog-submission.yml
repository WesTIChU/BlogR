name: Complete merged blog submission

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  complete:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the workflow code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Close the original submission issue
        env:
          GITHUB_EVENT_PAYLOAD: ${{ toJSON(github.event) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/complete-blog-submission.js

  health-check:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref ==
      github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'blog-submission/issue-')
      && contains(github.event.pull_request.body, '<!-- blogr-submission:')
    uses: ./.github/workflows/blog-health.yml
    permissions:
      contents: write
