name: Sync outbound click counts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: blog-metadata-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Retrieve and apply D1 totals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/sync-click-counts.js

      - name: Commit changed catalogue counts only
        shell: bash
        run: |
          set -euo pipefail
          default_branch='${{ github.event.repository.default_branch }}'
          remote_ref="refs/remotes/origin/${default_branch}"
          update_files=(data/blogs.json data/websites.json data/communities.json)
          git add "${update_files[@]}"
          if git diff --cached --quiet; then
            echo 'Click counts did not change.'
            exit 0
          fi
          mapfile -t staged_files < <(git diff --cached --name-only)
          for file in "${staged_files[@]}"; do
            case "$file" in
              data/blogs.json|data/websites.json|data/communities.json) ;;
              *)
                echo "Refusing to publish unexpected file: $file" >&2
                git diff --cached --name-status >&2
                exit 1
                ;;
            esac
          done
          node scripts/validate-click-count-changes.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync outbound click counts'
          git fetch origin "refs/heads/${default_branch}:${remote_ref}"
          git rebase "$remote_ref"
          git push origin "HEAD:refs/heads/${default_branch}"
